<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#030c12"/>
      <stop offset="100%" stop-color="#071824"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.25"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="512" height="512" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="24" fill="none" stroke="#0e2a36" stroke-width="8"/>
  <rect x="24" y="24" width="464" height="464" rx="20" fill="none" stroke="#22d3ee" stroke-opacity="0.75" stroke-width="2"/>
  <rect x="48" y="72" width="416" height="16" fill="url(#glow)" opacity="0.9"/>
  <circle cx="256" cy="254" r="120" fill="#061520" stroke="#22d3ee" stroke-width="10"/>
  <circle cx="256" cy="254" r="86" fill="none" stroke="#a5f3fc" stroke-opacity="0.35" stroke-width="4"/>
  <!-- Auto-injector / hypo needle icon -->
  <!-- Syringe barrel -->
  <rect x="220" y="194" width="40" height="90" rx="10" fill="#22d3ee"/>
  <!-- Plunger -->
  <rect x="216" y="184" width="48" height="14" rx="4" fill="#a5f3fc"/>
  <rect x="236" y="170" width="8" height="16" rx="2" fill="#a5f3fc"/>
  <!-- Needle -->
  <rect x="236" y="282" width="8" height="36" rx="3" fill="#a5f3fc"/>
  <polygon points="240,330 232,342 248,342" fill="#a5f3fc"/>
  <!-- Solo ring -->
  <circle cx="256" cy="254" r="100" fill="none" stroke="#22d3ee" stroke-opacity="0.25" stroke-width="3"/>
  <rect x="56" y="382" width="400" height="54" rx="8" fill="#030c12" stroke="#0e2a36" stroke-width="2"/>
  <text x="256" y="417" text-anchor="middle" font-size="28" letter-spacing="2" font-family="Oswald, Roboto Condensed, Arial, sans-serif" font-weight="700" fill="#f4f7ff">KICKSTART SOLO</text>
  <text x="256" y="466" text-anchor="middle" font-size="24" letter-spacing="4" font-family="Roboto, Arial, sans-serif" font-weight="700" fill="#22d3ee">AUTO-INJECT</text>
</svg>
