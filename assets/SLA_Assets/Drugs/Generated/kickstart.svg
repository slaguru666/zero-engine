  <rect x="0" y="0" width="512" height="512" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="24" fill="none" stroke="#1a3a26" stroke-width="8"/>
  <rect x="24" y="24" width="464" height="464" rx="20" fill="none" stroke="#4ade80" stroke-opacity="0.75" stroke-width="2"/>
