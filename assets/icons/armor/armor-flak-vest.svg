<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Flak vest: classic soft armor vest -->
  <rect x="16" y="18" width="32" height="38" rx="3" fill="#1a1a1a"/>
  <!-- Shoulder straps -->
  <rect x="14" y="8" width="10" height="12" rx="2" fill="#1a1a1a"/>
  <rect x="40" y="8" width="10" height="12" rx="2" fill="#1a1a1a"/>
  <!-- Pouch columns (utility vest feel) -->
  <rect x="18" y="20" width="10" height="8" rx="1" fill="white"/>
  <rect x="36" y="20" width="10" height="8" rx="1" fill="white"/>
  <rect x="18" y="30" width="10" height="8" rx="1" fill="white"/>
  <rect x="36" y="30" width="10" height="8" rx="1" fill="white"/>
  <rect x="18" y="40" width="10" height="8" rx="1" fill="white"/>
  <rect x="36" y="40" width="10" height="8" rx="1" fill="white"/>
  <!-- Neck opening -->
  <path d="M26,18 Q32,12 38,18" stroke="white" stroke-width="2" fill="none"/>
  <!-- Centre zip/velcro -->
  <rect x="30" y="18" width="4" height="38" rx="1" fill="white"/>
</svg>
