  <polygon points="34,30 38,28 42,30 42,34 38,36 34,34" fill="white"/>
  <polygon points="26,34 30,36 34,38 34,42 30,44 26,42" fill="white"/>
  <polygon points="34,34 38,36 42,38 42,42 38,44 34,42" fill="white"/>
