  <!-- Energy aura lines -->
  <line x1="32" y1="2" x2="32" y2="8" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <line x1="22" y1="4" x2="24" y2="9" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <line x1="42" y1="4" x2="40" y2="9" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <line x1="16" y1="10" x2="20" y2="13" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="48" y1="10" x2="44" y2="13" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Face mask with eye slits -->
  <ellipse cx="32" cy="12" rx="8" ry="6" fill="white"/>
  <ellipse cx="28" cy="11" rx="3" ry="2" fill="#1a1a1a"/>
  <ellipse cx="36" cy="11" rx="3" ry="2" fill="#1a1a1a"/>
  <!-- Central ebb channel on chest -->
  <path d="M28,24 Q32,18 36,24 L38,44 Q34,48 32,50 Q30,48 26,44 Z" fill="white"/>
  <!-- Ebb nodes along channel -->
