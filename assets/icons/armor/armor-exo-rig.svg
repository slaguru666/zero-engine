<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Central spine -->
  <rect x="29" y="8" width="6" height="48" rx="2" fill="#1a1a1a"/>
  <!-- Cross bar (shoulders) -->
  <rect x="6" y="16" width="52" height="6" rx="2" fill="#1a1a1a"/>
  <!-- Cross bar (waist) -->
  <rect x="10" y="42" width="44" height="6" rx="2" fill="#1a1a1a"/>
  <!-- Left arm strut -->
  <rect x="6" y="16" width="6" height="32" rx="2" fill="#1a1a1a"/>
  <!-- Right arm strut -->
  <rect x="52" y="16" width="6" height="32" rx="2" fill="#1a1a1a"/>
  <!-- Shoulder joints -->
  <circle cx="12" cy="22" r="6" fill="white" stroke="#1a1a1a" stroke-width="3"/>
  <circle cx="52" cy="22" r="6" fill="white" stroke="#1a1a1a" stroke-width="3"/>
  <!-- Waist joints -->
  <circle cx="12" cy="44" r="5" fill="white" stroke="#1a1a1a" stroke-width="3"/>
  <circle cx="52" cy="44" r="5" fill="white" stroke="#1a1a1a" stroke-width="3"/>
  <!-- Chest core -->
  <rect x="22" y="24" width="20" height="16" rx="3" fill="#1a1a1a"/>
  <rect x="26" y="28" width="12" height="8" rx="2" fill="white"/>
</svg>
