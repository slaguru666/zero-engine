<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Three pistol rounds -->
  <!-- Left round -->
  <rect x="10" y="24" width="10" height="28" rx="2" fill="#1a1a1a"/>
  <ellipse cx="15" cy="22" rx="5" ry="6" fill="#1a1a1a"/>
  <ellipse cx="15" cy="21" rx="3" ry="4" fill="white"/>
  <!-- Centre round (taller) -->
  <rect x="27" y="18" width="10" height="32" rx="2" fill="#1a1a1a"/>
  <ellipse cx="32" cy="16" rx="5" ry="6" fill="#1a1a1a"/>
  <ellipse cx="32" cy="15" rx="3" ry="4" fill="white"/>
  <!-- Right round -->
  <rect x="44" y="24" width="10" height="28" rx="2" fill="#1a1a1a"/>
  <ellipse cx="49" cy="22" rx="5" ry="6" fill="#1a1a1a"/>
  <ellipse cx="49" cy="21" rx="3" ry="4" fill="white"/>
  <!-- Case rims at bottom -->
  <rect x="8" y="50" width="14" height="3" rx="1" fill="#1a1a1a"/>
  <rect x="25" y="48" width="14" height="3" rx="1" fill="#1a1a1a"/>
  <rect x="42" y="50" width="14" height="3" rx="1" fill="#1a1a1a"/>
</svg>
