<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Two-tone capsule split diagonally -->
  <ellipse cx="32" cy="32" rx="22" ry="12" fill="#1a1a1a"/>
  <!-- Upper half white -->
  <path d="M10,32 Q10,20 32,20 Q54,20 54,32 Z" fill="white"/>
  <!-- Dividing line -->
  <ellipse cx="32" cy="32" rx="22" ry="12" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Score line (horizontal split) -->
  <line x1="10" y1="32" x2="54" y2="32" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Small SLA logo imprint on each half -->
  <line x1="24" y1="26" x2="24" y2="30" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="20" y1="28" x2="28" y2="28" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="40" y1="34" x2="40" y2="38" stroke="white" stroke-width="2"/>
  <line x1="36" y1="36" x2="44" y2="36" stroke="white" stroke-width="2"/>
</svg>
