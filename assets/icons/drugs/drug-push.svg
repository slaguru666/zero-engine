<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Auto-injector pen (medical emergency style) -->
  <rect x="22" y="8" width="20" height="46" rx="6" fill="#1a1a1a"/>
  <!-- Clear window showing dose -->
  <rect x="26" y="20" width="12" height="18" rx="2" fill="white"/>
  <!-- Dose level indicator line -->
  <line x1="26" y1="30" x2="38" y2="30" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Injection end (rounded tip) -->
  <ellipse cx="32" cy="54" rx="8" ry="5" fill="#1a1a1a"/>
  <!-- Needle exposed -->
  <rect x="30" y="56" width="4" height="7" rx="1" fill="#1a1a1a"/>
  <!-- Plus / medical cross on top -->
  <rect x="28" y="10" width="8" height="8" rx="1" fill="white"/>
  <line x1="32" y1="11" x2="32" y2="17" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="29" y1="14" x2="35" y2="14" stroke="#1a1a1a" stroke-width="2"/>
</svg>
