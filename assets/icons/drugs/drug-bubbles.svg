  <!-- Rising bubbles above -->
  <circle cx="24" cy="12" r="3" fill="#1a1a1a"/>
  <circle cx="32" cy="8" r="4" fill="#1a1a1a"/>
  <circle cx="40" cy="12" r="3" fill="#1a1a1a"/>
  <circle cx="28" cy="4" r="2" fill="#1a1a1a"/>
  <circle cx="36" cy="4" r="2.5" fill="#1a1a1a"/>
