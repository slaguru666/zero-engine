<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Clear tall vial (truth serum style) -->
  <rect x="24" y="14" width="16" height="40" rx="3" fill="#1a1a1a"/>
  <rect x="26" y="16" width="12" height="36" rx="2" fill="white"/>
  <!-- Liquid level (nearly full, clear) -->
  <rect x="26" y="18" width="12" height="28" rx="2" fill="#1a1a1a"/>
  <!-- Bubbles inside (truth serum fizz) -->
  <circle cx="30" cy="28" r="2" fill="white"/>
  <circle cx="35" cy="34" r="1.5" fill="white"/>
  <circle cx="31" cy="40" r="2" fill="white"/>
  <circle cx="34" cy="22" r="1.5" fill="white"/>
  <!-- Narrow neck -->
  <rect x="27" y="10" width="10" height="6" rx="2" fill="#1a1a1a"/>
  <!-- Dropper pipette tip -->
  <path d="M30,6 L34,6 L33,11 L31,11 Z" fill="#1a1a1a"/>
  <!-- Drop -->
  <ellipse cx="32" cy="4" rx="2" ry="3" fill="#1a1a1a"/>
</svg>
