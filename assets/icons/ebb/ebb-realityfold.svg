<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Concentric rings — dimensional portal -->
  <circle cx="50" cy="50" r="44" fill="none" stroke="white" stroke-width="6"/>
  <circle cx="50" cy="50" r="30" fill="none" stroke="white" stroke-width="5"/>
  <circle cx="50" cy="50" r="16" fill="none" stroke="white" stroke-width="4"/>
  <!-- Void centre -->
  <circle cx="50" cy="50" r="7" fill="white"/>
  <!-- Diagonal fold lines suggesting dimensional tear -->
  <line x1="20" y1="20" x2="34" y2="34" stroke="white" stroke-width="5" stroke-linecap="round"/>
  <line x1="80" y1="80" x2="66" y2="66" stroke="white" stroke-width="5" stroke-linecap="round"/>
  <line x1="80" y1="20" x2="66" y2="34" stroke="white" stroke-width="5" stroke-linecap="round"/>
  <line x1="20" y1="80" x2="34" y2="66" stroke="white" stroke-width="5" stroke-linecap="round"/>
</svg>
