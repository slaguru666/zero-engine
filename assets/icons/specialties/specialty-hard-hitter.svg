<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Hard Hitter: heavy fist with impact lines -->
  <!-- Impact lines radiating from fist -->
  <line x1="32" y1="8" x2="32" y2="2" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="48" y1="14" x2="53" y2="9" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="54" y1="30" x2="61" y2="30" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="16" y1="14" x2="11" y2="9" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="10" y1="30" x2="3" y2="30" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <!-- Fist — 4 fingers curled -->
  <rect x="18" y="26" width="28" height="18" rx="5" fill="#1a1a1a"/>
  <!-- Finger knuckles row -->
  <rect x="19" y="20" width="6" height="10" rx="3" fill="#1a1a1a"/>
  <rect x="27" y="18" width="6" height="12" rx="3" fill="#1a1a1a"/>
  <rect x="35" y="18" width="6" height="12" rx="3" fill="#1a1a1a"/>
  <rect x="43" y="20" width="6" height="10" rx="3" fill="#1a1a1a"/>
  <!-- Thumb -->
  <rect x="12" y="30" width="9" height="8" rx="4" fill="#1a1a1a"/>
  <!-- Knuckle highlights -->
  <rect x="20" y="22" width="4" height="4" rx="2" fill="white" opacity="0.5"/>
  <rect x="28" y="20" width="4" height="4" rx="2" fill="white" opacity="0.5"/>
  <rect x="36" y="20" width="4" height="4" rx="2" fill="white" opacity="0.5"/>
  <rect x="44" y="22" width="4" height="4" rx="2" fill="white" opacity="0.5"/>
  <!-- Fist face highlight -->
  <rect x="20" y="28" width="24" height="5" rx="2" fill="white" opacity="0.2"/>
  <!-- Wrist -->
  <rect x="20" y="44" width="24" height="8" rx="3" fill="#1a1a1a"/>
</svg>
