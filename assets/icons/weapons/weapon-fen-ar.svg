<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Barrel with muzzle device -->
  <rect x="4" y="27" width="36" height="6" rx="1" fill="#1a1a1a"/>
  <!-- Distinctive carry handle on top -->
  <rect x="28" y="16" width="18" height="12" rx="2" fill="#1a1a1a"/>
  <!-- Carry handle aperture -->
  <rect x="30" y="18" width="14" height="8" rx="1" fill="white"/>
  <!-- Receiver -->
  <rect x="22" y="22" width="22" height="16" rx="2" fill="#1a1a1a"/>
  <!-- Handguard with vents -->
  <rect x="8" y="24" width="16" height="10" rx="2" fill="#1a1a1a"/>
  <line x1="12" y1="24" x2="12" y2="34" stroke="white" stroke-width="1"/>
  <line x1="16" y1="24" x2="16" y2="34" stroke="white" stroke-width="1"/>
  <line x1="20" y1="24" x2="20" y2="34" stroke="white" stroke-width="1"/>
  <!-- Magazine (curved STANAG style) -->
  <path d="M30,38 Q28,50 31,52 Q34,54 36,50 L36,38 Z" fill="#1a1a1a"/>
  <!-- Pistol grip -->
  <rect x="40" y="34" width="7" height="14" rx="2" fill="#1a1a1a"/>
  <!-- Stock -->
  <path d="M44,22 L60,24 L60,36 L44,38 Z" fill="#1a1a1a"/>
  <!-- Charging handle -->
  <rect x="40" y="20" width="4" height="4" rx="1" fill="#1a1a1a"/>
  <!-- Muzzle -->
  <rect x="2" y="26" width="4" height="8" rx="1" fill="#1a1a1a"/>
</svg>
