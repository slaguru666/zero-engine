<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Wide double barrel -->
  <rect x="4" y="22" width="36" height="8" rx="2" fill="#1a1a1a"/>
  <rect x="4" y="32" width="36" height="8" rx="2" fill="#1a1a1a"/>
  <!-- Barrel divider -->
  <line x1="4" y1="30" x2="40" y2="30" stroke="white" stroke-width="2"/>
  <!-- Receiver -->
  <rect x="34" y="20" width="16" height="22" rx="2" fill="#1a1a1a"/>
