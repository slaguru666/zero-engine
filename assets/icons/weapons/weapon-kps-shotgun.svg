  <!-- Pump grip detail -->
  <line x1="14" y1="40" x2="14" y2="47" stroke="white" stroke-width="1.5"/>
  <line x1="18" y1="40" x2="18" y2="47" stroke="white" stroke-width="1.5"/>
  <line x1="22" y1="40" x2="22" y2="47" stroke="white" stroke-width="1.5"/>
  <line x1="26" y1="40" x2="26" y2="47" stroke="white" stroke-width="1.5"/>
  <!-- Pistol grip -->
  <path d="M44,40 L50,40 L52,58 L42,58 L40,42 Z" fill="#1a1a1a"/>
  <!-- Stock -->
  <path d="M48,20 L62,22 L62,34 L48,36 Z" fill="#1a1a1a"/>
