<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Long precision barrel -->
  <rect x="4" y="28" width="44" height="6" rx="1" fill="#1a1a1a"/>
  <!-- EM coil rings along barrel -->
  <rect x="8" y="25" width="4" height="12" rx="2" fill="#1a1a1a"/>
  <rect x="17" y="25" width="4" height="12" rx="2" fill="#1a1a1a"/>
  <rect x="26" y="25" width="4" height="12" rx="2" fill="#1a1a1a"/>
  <rect x="35" y="25" width="4" height="12" rx="2" fill="#1a1a1a"/>
  <!-- Power housing / receiver -->
  <rect x="44" y="22" width="14" height="18" rx="3" fill="#1a1a1a"/>
  <!-- Power cell indicator -->
  <rect x="46" y="24" width="10" height="6" rx="1" fill="white"/>
  <rect x="46" y="24" width="6" height="6" rx="1" fill="#1a1a1a"/>
  <!-- Stock -->
  <path d="M56,28 L62,26 L62,36 L56,34 Z" fill="#1a1a1a"/>
  <!-- Grip under receiver -->
  <rect x="48" y="40" width="7" height="14" rx="2" fill="#1a1a1a"/>
  <!-- Bipod (deployed) -->
  <line x1="14" y1="37" x2="10" y2="52" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
  <line x1="18" y1="37" x2="22" y2="52" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
  <!-- Muzzle tip -->
  <rect x="2" y="27" width="4" height="8" rx="1" fill="#1a1a1a"/>
</svg>
