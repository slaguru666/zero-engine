<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Long heavy barrel -->
  <rect x="2" y="26" width="44" height="8" rx="2" fill="#1a1a1a"/>
  <!-- Barrel shroud with vents -->
  <rect x="6" y="23" width="28" height="14" rx="2" fill="#1a1a1a"/>
  <line x1="12" y1="23" x2="12" y2="37" stroke="white" stroke-width="1"/>
  <line x1="18" y1="23" x2="18" y2="37" stroke="white" stroke-width="1"/>
  <line x1="24" y1="23" x2="24" y2="37" stroke="white" stroke-width="1"/>
  <line x1="30" y1="23" x2="30" y2="37" stroke="white" stroke-width="1"/>
  <!-- Receiver -->
  <rect x="34" y="20" width="20" height="18" rx="2" fill="#1a1a1a"/>
  <!-- Ammo belt feeding in from bottom -->
  <path d="M34,38 Q30,44 26,38 Q22,44 18,38 Q14,44 10,38 Q6,44 2,38"
        stroke="#1a1a1a" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- Belt feed housing -->
  <rect x="36" y="36" width="12" height="8" rx="2" fill="#1a1a1a"/>
  <!-- Pistol grip -->
  <rect x="46" y="36" width="7" height="14" rx="2" fill="#1a1a1a"/>
  <!-- Stock (folding) -->
  <path d="M52,20 L62,22 L62,32 L52,36 Z" fill="#1a1a1a"/>
  <!-- Bipod -->
  <line x1="10" y1="37" x2="6" y2="54" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
  <line x1="16" y1="37" x2="20" y2="54" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
  <!-- Top carry handle -->
  <path d="M38,20 Q44,14 50,20" stroke="#1a1a1a" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Muzzle brake -->
  <rect x="2" y="24" width="6" height="12" rx="1" fill="#1a1a1a"/>
  <line x1="4" y1="26" x2="4" y2="28" stroke="white" stroke-width="1"/>
  <line x1="4" y1="32" x2="4" y2="34" stroke="white" stroke-width="1"/>
</svg>
