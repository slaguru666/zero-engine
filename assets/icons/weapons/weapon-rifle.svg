  <rect x="2" y="25" width="6" height="10" rx="1" fill="#1a1a1a"/>
  <line x1="4" y1="28" x2="4" y2="32" stroke="white" stroke-width="1"/>
  <line x1="6" y1="28" x2="6" y2="32" stroke="white" stroke-width="1"/>
