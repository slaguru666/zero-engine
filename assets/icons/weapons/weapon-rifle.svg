<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Long barrel -->
  <rect x="4" y="27" width="46" height="6" rx="2" fill="#1a1a1a"/>
  <!-- Receiver/body -->
  <rect x="22" y="22" width="24" height="14" rx="2" fill="#1a1a1a"/>
  <!-- Stock -->
  <path d="M46,22 L60,24 L60,36 L46,36 Z" fill="#1a1a1a"/>
  <!-- Stock butt -->
  <rect x="56" y="22" width="6" height="14" rx="2" fill="#1a1a1a"/>
