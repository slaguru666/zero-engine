  <!-- Scope rail -->
  <rect x="26" y="20" width="18" height="3" rx="1" fill="#1a1a1a"/>
  <!-- Scope -->
  <rect x="28" y="16" width="14" height="5" rx="2" fill="#1a1a1a"/>
  <rect x="30" y="17" width="10" height="3" rx="1" fill="white"/>
