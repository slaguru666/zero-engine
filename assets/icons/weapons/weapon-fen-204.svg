<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Heavy slide (wider than standard) -->
  <rect x="14" y="18" width="34" height="10" rx="2" fill="#1a1a1a"/>
  <!-- Ported compensator on barrel end -->
  <rect x="6" y="20" width="10" height="8" rx="1" fill="#1a1a1a"/>
  <!-- Compensator ports -->
  <line x1="8" y1="20" x2="8" y2="22" stroke="white" stroke-width="1.5"/>
  <line x1="11" y1="20" x2="11" y2="22" stroke="white" stroke-width="1.5"/>
  <line x1="14" y1="20" x2="14" y2="22" stroke="white" stroke-width="1.5"/>
  <!-- Frame -->
  <rect x="18" y="26" width="28" height="10" rx="2" fill="#1a1a1a"/>
  <!-- Rail under barrel -->
  <rect x="8" y="27" width="18" height="4" rx="1" fill="#1a1a1a"/>
  <!-- Large grip (fat frame) -->
  <path d="M40,28 L46,28 L50,54 L38,54 L36,30 Z" fill="#1a1a1a"/>
  <!-- Grip texture -->
  <line x1="39" y1="36" x2="48" y2="36" stroke="white" stroke-width="1.5"/>
  <line x1="39" y1="43" x2="48" y2="43" stroke="white" stroke-width="1.5"/>
  <line x1="39" y1="50" x2="48" y2="50" stroke="white" stroke-width="1.5"/>
  <!-- Trigger guard -->
  <path d="M36,32 Q32,42 34,46 L38,52 L38,44 Z" fill="#1a1a1a"/>
  <!-- Hammer -->
  <rect x="44" y="16" width="5" height="6" rx="1" fill="#1a1a1a"/>
</svg>
