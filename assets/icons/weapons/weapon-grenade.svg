<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Grenade body (segmented) -->
  <ellipse cx="32" cy="38" rx="16" ry="18" fill="#1a1a1a"/>
  <!-- Segment lines -->
  <line x1="16" y1="32" x2="48" y2="32" stroke="white" stroke-width="1.5"/>
  <line x1="16" y1="38" x2="48" y2="38" stroke="white" stroke-width="1.5"/>
  <line x1="16" y1="44" x2="48" y2="44" stroke="white" stroke-width="1.5"/>
  <line x1="32" y1="20" x2="32" y2="56" stroke="white" stroke-width="1.5"/>
  <!-- Safety lever -->
  <rect x="28" y="18" width="16" height="5" rx="2" fill="#1a1a1a"/>
  <line x1="36" y1="14" x2="36" y2="20" stroke="#1a1a1a" stroke-width="3"/>
  <!-- Safety pin ring -->
  <ellipse cx="44" cy="14" rx="5" ry="4" fill="none" stroke="#1a1a1a" stroke-width="3"/>
  <!-- Fuze body -->
  <rect x="28" y="10" width="8" height="10" rx="2" fill="#1a1a1a"/>
  <!-- Fuze cap -->
  <rect x="26" y="6" width="12" height="5" rx="2" fill="#1a1a1a"/>
</svg>
