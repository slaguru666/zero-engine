<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Heavy rotary barrel cluster (3 barrels) -->
  <rect x="4" y="18" width="32" height="8" rx="2" fill="#1a1a1a"/>
  <rect x="4" y="28" width="32" height="8" rx="2" fill="#1a1a1a"/>
  <rect x="4" y="38" width="32" height="8" rx="2" fill="#1a1a1a"/>
  <!-- Rotation housing -->
  <circle cx="34" cy="32" rx="14" fill="#1a1a1a" cy="32" r="14"/>
  <circle cx="34" cy="32" r="9" fill="white"/>
  <circle cx="34" cy="32" r="4" fill="#1a1a1a"/>
  <!-- Spoke details -->
  <line x1="34" y1="23" x2="34" y2="41" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="25" y1="32" x2="43" y2="32" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Power housing rear -->
  <rect x="46" y="22" width="14" height="20" rx="3" fill="#1a1a1a"/>
  <!-- Power cell -->
  <rect x="48" y="25" width="10" height="7" rx="1" fill="white"/>
  <rect x="48" y="25" width="5" height="7" rx="1" fill="#1a1a1a"/>
  <!-- Shoulder brace -->
  <rect x="48" y="42" width="14" height="8" rx="2" fill="#1a1a1a"/>
  <!-- Muzzle flash guards -->
  <rect x="2" y="17" width="5" height="10" rx="1" fill="#1a1a1a"/>
  <rect x="2" y="27" width="5" height="10" rx="1" fill="#1a1a1a"/>
  <rect x="2" y="37" width="5" height="10" rx="1" fill="#1a1a1a"/>
</svg>
