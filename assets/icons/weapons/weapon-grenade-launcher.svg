  <circle cx="44" cy="23" r="2" fill="#1a1a1a"/>
  <circle cx="49" cy="26" r="2" fill="#1a1a1a"/>
  <circle cx="51" cy="32" r="2" fill="#1a1a1a"/>
  <circle cx="48" cy="37" r="2" fill="#1a1a1a"/>
  <circle cx="40" cy="37" r="2" fill="#1a1a1a"/>
  <circle cx="37" cy="32" r="2" fill="#1a1a1a"/>
