<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Triple barrel cluster -->
  <rect x="4" y="20" width="40" height="7" rx="2" fill="#1a1a1a"/>
  <rect x="4" y="28" width="40" height="7" rx="2" fill="#1a1a1a"/>
  <rect x="4" y="36" width="40" height="7" rx="2" fill="#1a1a1a"/>
  <!-- Muzzle brakes -->
  <rect x="2" y="19" width="6" height="9" rx="1" fill="#1a1a1a"/>
  <rect x="2" y="27" width="6" height="9" rx="1" fill="#1a1a1a"/>
  <rect x="2" y="35" width="6" height="9" rx="1" fill="#1a1a1a"/>
  <!-- Muzzle vents -->
  <line x1="3" y1="22" x2="3" y2="26" stroke="white" stroke-width="1"/>
  <line x1="3" y1="30" x2="3" y2="34" stroke="white" stroke-width="1"/>
  <line x1="3" y1="38" x2="3" y2="42" stroke="white" stroke-width="1"/>
  <!-- Receiver housing -->
  <rect x="40" y="18" width="16" height="28" rx="3" fill="#1a1a1a"/>
  <!-- Ammo drum -->
  <circle cx="50" cy="48" r="10" fill="#1a1a1a"/>
  <circle cx="50" cy="48" r="6" fill="white"/>
  <circle cx="50" cy="48" r="3" fill="#1a1a1a"/>
  <!-- Feed mechanism -->
  <rect x="44" y="38" width="12" height="6" rx="1" fill="#1a1a1a"/>
  <!-- Cooling vents on barrels -->
  <line x1="20" y1="20" x2="20" y2="27" stroke="white" stroke-width="1"/>
  <line x1="26" y1="20" x2="26" y2="27" stroke="white" stroke-width="1"/>
  <line x1="20" y1="28" x2="20" y2="35" stroke="white" stroke-width="1"/>
  <line x1="26" y1="28" x2="26" y2="35" stroke="white" stroke-width="1"/>
</svg>
