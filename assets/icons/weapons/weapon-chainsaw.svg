<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Engine housing -->
  <rect x="24" y="30" width="30" height="22" rx="4" fill="#1a1a1a"/>
  <!-- Blade guide bar -->
  <rect x="6" y="18" width="34" height="12" rx="3" fill="#1a1a1a"/>
  <!-- Blade tip (rounded) -->
  <ellipse cx="42" cy="24" rx="8" ry="6" fill="#1a1a1a"/>
  <!-- Chain teeth top -->
  <path d="M6,18 L8,14 L12,18 L16,14 L20,18 L24,14 L28,18 L32,14 L36,18 L40,14 L44,18"
        stroke="white" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Chain teeth bottom -->
  <path d="M6,30 L8,34 L12,30 L16,34 L20,30 L24,34 L28,30 L32,34 L36,30 L40,34 L44,30"
        stroke="white" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Engine vent lines -->
  <line x1="26" y1="34" x2="26" y2="48" stroke="white" stroke-width="1.5"/>
  <line x1="30" y1="34" x2="30" y2="48" stroke="white" stroke-width="1.5"/>
  <line x1="34" y1="34" x2="34" y2="48" stroke="white" stroke-width="1.5"/>
  <!-- Handle grip -->
  <rect x="44" y="34" width="8" height="16" rx="3" fill="#1a1a1a"/>
  <!-- Trigger -->
  <rect x="36" y="46" width="10" height="5" rx="2" fill="#1a1a1a"/>
  <line x1="40" y1="46" x2="40" y2="51" stroke="white" stroke-width="1.5"/>
</svg>
