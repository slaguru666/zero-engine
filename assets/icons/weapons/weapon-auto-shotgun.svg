<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Wide barrel -->
  <rect x="4" y="26" width="32" height="10" rx="2" fill="#1a1a1a"/>
  <!-- Receiver -->
  <rect x="32" y="20" width="18" height="20" rx="2" fill="#1a1a1a"/>
  <!-- Drum magazine (large circle) -->
  <circle cx="40" cy="46" r="14" fill="#1a1a1a"/>
  <circle cx="40" cy="46" r="10" fill="white"/>
  <circle cx="40" cy="46" r="5" fill="#1a1a1a"/>
  <!-- Drum spokes -->
  <line x1="40" y1="36" x2="40" y2="56" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="30" y1="46" x2="50" y2="46" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="33" y1="39" x2="47" y2="53" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="47" y1="39" x2="33" y2="53" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Pistol grip -->
  <path d="M44,38 L50,38 L52,58 L44,58 L42,40Z" fill="#1a1a1a"/>
  <!-- Folding stock -->
  <path d="M48,20 L62,22 L62,30 L48,32 Z" fill="#1a1a1a"/>
  <!-- Foregrip -->
  <rect x="10" y="36" width="6" height="12" rx="2" fill="#1a1a1a"/>
  <!-- Muzzle -->
  <rect x="2" y="25" width="4" height="12" rx="1" fill="#1a1a1a"/>
</svg>
