  <!-- Frame -->
  <rect x="18" y="26" width="28" height="8" rx="1" fill="#1a1a1a"/>
  <!-- Extended magazine (tall, angular) -->
  <rect x="26" y="34" width="8" height="22" rx="2" fill="#1a1a1a"/>
  <!-- Mag baseplate -->
  <rect x="24" y="54" width="12" height="3" rx="1" fill="#1a1a1a"/>
  <!-- Grip (angular) -->
