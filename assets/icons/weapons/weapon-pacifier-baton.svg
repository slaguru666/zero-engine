<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- T-baton: cross handle at top -->
  <!-- Horizontal cross bar -->
  <rect x="10" y="10" width="44" height="8" rx="4" fill="#1a1a1a"/>
  <!-- Vertical shaft -->
  <rect x="28" y="16" width="8" height="44" rx="3" fill="#1a1a1a"/>
  <!-- Shock tip at bottom -->
  <ellipse cx="32" cy="60" rx="6" ry="4" fill="#1a1a1a"/>
  <!-- Shock coil rings at bottom of shaft -->
  <rect x="26" y="46" width="12" height="3" rx="1" fill="white"/>
  <rect x="26" y="51" width="12" height="3" rx="1" fill="white"/>
  <!-- Cross bar end caps -->
  <ellipse cx="12" cy="14" rx="4" ry="5" fill="#1a1a1a"/>
  <ellipse cx="52" cy="14" rx="4" ry="5" fill="#1a1a1a"/>
  <!-- SLA badge / brand mark on shaft -->
  <rect x="28" y="28" width="8" height="10" rx="1" fill="white"/>
  <rect x="30" y="30" width="4" height="6" rx="1" fill="#1a1a1a"/>
</svg>
