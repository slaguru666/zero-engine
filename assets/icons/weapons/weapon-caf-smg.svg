<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Top-feed magazine (above receiver) -->
  <rect x="24" y="6" width="10" height="16" rx="2" fill="#1a1a1a"/>
  <!-- Receiver body -->
  <rect x="16" y="20" width="32" height="12" rx="2" fill="#1a1a1a"/>
  <!-- Barrel (short) -->
  <rect x="4" y="22" width="14" height="8" rx="2" fill="#1a1a1a"/>
  <!-- Folded stock / rear block -->
  <rect x="46" y="20" width="14" height="12" rx="2" fill="#1a1a1a"/>
  <!-- Folding joint line -->
  <line x1="46" y1="20" x2="46" y2="32" stroke="white" stroke-width="2"/>
  <!-- Grip -->
  <rect x="36" y="32" width="8" height="14" rx="2" fill="#1a1a1a"/>
  <!-- Foregrip -->
  <rect x="10" y="30" width="6" height="10" rx="2" fill="#1a1a1a"/>
  <!-- Ejection port -->
  <rect x="28" y="21" width="8" height="4" rx="1" fill="white"/>
  <!-- Sight rail -->
  <rect x="18" y="18" width="20" height="3" rx="1" fill="#1a1a1a"/>
</svg>
