<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Bullpup: barrel extends to front, mag/action behind grip -->
  <!-- Barrel -->
  <rect x="4" y="27" width="28" height="7" rx="2" fill="#1a1a1a"/>
  <!-- Bullpup body (magazine behind grip) -->
  <rect x="14" y="20" width="44" height="18" rx="3" fill="#1a1a1a"/>
  <!-- Magazine (behind grip, inside stock) -->
  <rect x="46" y="38" width="8" height="18" rx="2" fill="#1a1a1a"/>
  <!-- Pistol grip (central position) -->
  <rect x="30" y="36" width="8" height="14" rx="2" fill="#1a1a1a"/>
  <!-- Compact handguard -->
  <rect x="6" y="24" width="12" height="14" rx="2" fill="#1a1a1a"/>
  <line x1="10" y1="24" x2="10" y2="38" stroke="white" stroke-width="1"/>
  <line x1="14" y1="24" x2="14" y2="38" stroke="white" stroke-width="1"/>
  <!-- Ejection port -->
  <rect x="24" y="21" width="8" height="4" rx="1" fill="white"/>
  <!-- Cheek weld / rear stock flat -->
  <rect x="54" y="20" width="8" height="14" rx="2" fill="#1a1a1a"/>
  <!-- Sight -->
  <rect x="18" y="18" width="16" height="4" rx="1" fill="#1a1a1a"/>
  <rect x="20" y="17" width="12" height="3" rx="1" fill="white"/>
</svg>
